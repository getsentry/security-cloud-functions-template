name: Terraform Plan

on:
  pull_request:
    branches:
      - main

# One plan per PR. A new push supersedes the in-flight run rather than racing it.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: static checks
    uses: ./.github/workflows/terraform-checks.yaml

  # Catches a broken Dockerfile at review time instead of on merge, when the
  # apply workflow would fail halfway through. Builds only -- no registry push,
  # and deliberately no cloud credentials, since this runs untrusted PR code.
  docker:
    name: build cloud run images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker build
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=0
          for dir in cloudruns/*/; do
            [ -f "$dir/Dockerfile" ] || continue
            name="$(basename "$dir")"
            echo "::group::building $name"
            docker build --tag "$name:pr-${{ github.event.pull_request.number }}" "$dir"
            echo "::endgroup::"
            built=$((built + 1))
          done
          echo "built $built image(s)"

  plan:
    name: tf plan
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: gcp auth (tf plan)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # sbin/bootstrap fills these in from `terraform output`.
          workload_identity_provider: projects/546928617664/locations/global/workloadIdentityPools/gha-terraform-checker-pool/providers/gha-terraform-checker-provider
          # Read-only: plan executes untrusted PR code, so this identity must
          # hold no write or secret-read permissions.
          service_account: gha-cf-tf-plan@jeffreyhung-test.iam.gserviceaccount.com

      - name: terraform plan
        id: terraform-plan
        uses: dflook/terraform-plan@6c82d55cb6c21f54498dc4479d7491736b037ba4 # v3.0.1
        if: ${{ steps.auth.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The plan identity is read-only on the state bucket so it cannot
          # write a lock object. Plan never writes state, so this is safe --
          # see the note on tfstate-bucket-iam in infrastructure/main.tf.
          TF_CLI_ARGS_plan: -lock=false
          # Cloud Run images are tagged by commit. Using the PR head SHA makes
          # the plan show a realistic image change; the apply on main will use
          # the merge commit's SHA, so the tag in the plan is indicative rather
          # than exact.
          TF_VAR_cloudrun_image_tag: ${{ github.event.pull_request.head.sha }}
        with:
          add_github_comment: changes-only
